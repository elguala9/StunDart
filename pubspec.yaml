name: stundart_workspace
description: A Dart monorepo workspace for StunDart packages
version: 1.0.0
publish_to: none

environment:
  sdk: '^3.9.4'

workspace:
  - packages/Stun
  - packages/StunDartTests

dev_dependencies:
  melos: ^7.3.0

melos:
  scripts:
    barrels:
      run: melos exec --ignore=stundart_tests -- dart pub global run index_generator
      description: Generate barrel/index files for all packages using index_generator.
